name: Audit Goxboard legacy identifiers after P0-01 documentation cleanup

on:
  push:
    branches:
      - ci/audit-goxboard-old-identifiers-20261114

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout private Goxboard source
        uses: actions/checkout@v5
        with:
          repository: yuyuzheng-dev/goxboard
          ref: chore/p0-01-remove-legacy-ggboard-identifiers-20261114
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source
      - name: Find every old Goxboard identifier
        working-directory: source
        shell: bash
        run: |
          set -uo pipefail
          echo "Source HEAD: $(git rev-parse HEAD)"
          legacy_hits="$(git grep -n -I -i -E 'ggboard' -- . || true)"
          legacy_paths="$(git ls-files | grep -i -E 'ggboard' || true)"
          if [[ -n "$legacy_hits" || -n "$legacy_paths" ]]; then
            echo "===== LEGACY IDENTIFIER CONTENT HITS ====="
            printf '%s\\n' "$legacy_hits"
            echo "===== LEGACY IDENTIFIER PATH HITS ====="
            printf '%s\\n' "$legacy_paths"
            exit 1
          fi
          echo "No legacy project identifiers remain in tracked file contents or paths."
