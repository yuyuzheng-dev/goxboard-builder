name: Goxboard performance baseline

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private Goxboard source commit SHA (defaults to the Phase 1 harness commit)
        required: false
        default: 499cad1e0d4b5071ac91121b4f4fb8f6e185f070
        type: string

permissions:
  contents: read

concurrency:
  group: goxboard-phase1-baseline-${{ github.event.inputs.source_sha || 'default' }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: API and SQLite / PostgreSQL / MySQL baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      GOXBOARD_DB_BENCH_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/goxboard_bench?sslmode=disable
      GOXBOARD_DB_BENCH_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/goxboard_bench
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v7
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ github.event.inputs.source_sha || '499cad1e0d4b5071ac91121b4f4fb8f6e185f070' }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Resolve source revision
        id: source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark performance baseline pending
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          script: |
            const targetUrl = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.repos.createCommitStatus({
              owner: 'yuyuzheng-dev',
              repo: 'goxboard',
              sha: '${{ steps.source.outputs.sha }}',
              state: 'pending',
              context: 'goxboard-builder/perf-baseline',
              description: 'SQLite API and SQLite/PostgreSQL/MySQL baselines are running',
              target_url: targetUrl
            });

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      - name: Enforce benchmark harness lint and tests
        working-directory: source
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run --max-same-issues 0 --max-issues-per-linter 0 ./scripts/dbbench ./scripts/bench
          go test -race ./scripts/dbbench ./scripts/bench -count=1
          go vet ./scripts/dbbench ./scripts/bench

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build frontend assets for the embedded server
        run: |
          set -euo pipefail
          pnpm -C source/web install --frozen-lockfile
          pnpm -C source/web build
          mkdir -p source/internal/static/dist
          cp -a source/web/dist/. source/internal/static/dist/

      - name: Build Goxboard server and benchmark tools
        id: build
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/goxboard ./cmd/goxboard
          go build -o "$RUNNER_TEMP/dbbench" ./scripts/dbbench

      - name: Run API baseline (SQLite)
        id: api
        env:
          BIN: ${{ github.workspace }}/source/bin/goxboard
          API_OUT: ${{ runner.temp }}/api-perf
        run: |
          set -euo pipefail
          mkdir -p "$API_OUT"
          set +e
          KEEP_LOG=1 bash source/scripts/bench/run.sh -d 10s -warmup 2s -pause 1s -out "$API_OUT" -commit "${{ steps.source.outputs.sha }}" 2>&1 | tee "$API_OUT/run.log"
          rc=${PIPESTATUS[0]}
          set -e
          work_dir="$(sed -n 's/^kept //p' "$API_OUT/run.log" | tail -n 1)"
          if [[ -n "$work_dir" && -f "$work_dir/server.log" ]]; then
            cp "$work_dir/server.log" "$API_OUT/server.log"
          else
            echo "::warning::API benchmark server.log was not preserved"
          fi
          exit "$rc"

      - name: Prepare disposable PostgreSQL and MySQL databases
        id: prepare
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client postgresql-client
          export PGPASSWORD=test
          createdb -h 127.0.0.1 -U postgres goxboard_bench
          mysql -h 127.0.0.1 -uroot -ptest -e "CREATE DATABASE goxboard_bench"
          # Separate disposable databases keep every concurrency profile on a clean dataset.
          for concurrency in 1 4 8 16 32; do
            createdb -h 127.0.0.1 -U postgres "goxboard_bench_c${concurrency}"
            mysql -h 127.0.0.1 -uroot -ptest -e "CREATE DATABASE goxboard_bench_c${concurrency}"
          done
          # Preserve the latest InnoDB deadlock trace in service logs for benchmark diagnosis.
          mysql -h 127.0.0.1 -uroot -ptest -e "SET GLOBAL innodb_print_all_deadlocks=ON"

      - name: Run database baselines
        id: db
        if: ${{ always() && steps.build.outcome == 'success' && steps.prepare.outcome == 'success' }}
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db-perf"
          failures=0
          run_driver() {
            local driver="$1"
            local output="$2"
            echo "::group::Database baseline: $driver (16 workers, 5s)"
            if "$RUNNER_TEMP/dbbench" -driver "$driver" -duration 5s -concurrency 16 -out "$output"; then
              echo "PASS: $driver baseline"
            else
              rc=$?
              echo "::error title=$driver database baseline failed::dbbench exited with status $rc; see the JSON artifact and scenario errors"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          run_profile() {
            local driver="$1"
            local concurrency="$2"
            local output="$3"
            local dsn=""
            case "$driver" in
              postgres) dsn="postgres://postgres:test@127.0.0.1:5432/goxboard_bench_c${concurrency}?sslmode=disable" ;;
              mysql) dsn="root:test@tcp(127.0.0.1:3306)/goxboard_bench_c${concurrency}" ;;
            esac
            local -a args=(-driver "$driver" -duration 8s -concurrency "$concurrency" -out "$output")
            if [[ -n "$dsn" ]]; then args+=(-dsn "$dsn"); fi
            echo "::group::Database stress: $driver (concurrency $concurrency, 8s)"
            if "$RUNNER_TEMP/dbbench" "${args[@]}"; then
              echo "PASS: $driver concurrency $concurrency"
            else
              rc=$?
              echo "::error title=$driver concurrency $concurrency failed::dbbench exited with status $rc; see the JSON artifact and scenario errors"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          run_driver sqlite "$RUNNER_TEMP/db-perf/sqlite.json"
          run_driver postgres "$RUNNER_TEMP/db-perf/postgres.json"
          run_driver mysql "$RUNNER_TEMP/db-perf/mysql.json"
          # Sweep 1/4/8/16/32 concurrent node writers on clean, isolated datasets.
          for concurrency in 1 4 8 16 32; do
            run_profile sqlite "$concurrency" "$RUNNER_TEMP/db-perf/sqlite-c${concurrency}.json"
            run_profile postgres "$concurrency" "$RUNNER_TEMP/db-perf/postgres-c${concurrency}.json"
            run_profile mysql "$concurrency" "$RUNNER_TEMP/db-perf/mysql-c${concurrency}.json"
            # Capture the most recent InnoDB deadlock/lock-wait trace for each profile.
            mysql -h 127.0.0.1 -uroot -ptest -e "SHOW ENGINE INNODB STATUS\\G" > "$RUNNER_TEMP/db-perf/mysql-c${concurrency}-innodb-status.txt" || true
          done
          mysql -h 127.0.0.1 -uroot -ptest -e "SHOW ENGINE INNODB STATUS\\G" > "$RUNNER_TEMP/db-perf/mysql-innodb-status.txt" || true
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures database baseline/profile(s) failed; all drivers and concurrency profiles were still attempted"
            exit 1
          fi

      - name: Upload baseline artifacts
        id: upload
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: goxboard-phase1-baseline-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/api-perf/*
            ${{ runner.temp }}/db-perf/*
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Report performance baseline status
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          script: |
            const results = {
              api: '${{ steps.api.outcome }}',
              database: '${{ steps.db.outcome }}',
              artifacts: '${{ steps.upload.outcome }}'
            };
            const passed = Object.values(results).every(result => result === 'success');
            const targetUrl = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.repos.createCommitStatus({
              owner: 'yuyuzheng-dev',
              repo: 'goxboard',
              sha: '${{ steps.source.outputs.sha }}',
              state: passed ? 'success' : 'failure',
              context: 'goxboard-builder/perf-baseline',
              description: passed
                ? 'SQLite API and SQLite/PostgreSQL/MySQL baselines passed'
                : 'One or more performance baseline stages failed or were skipped',
              target_url: targetUrl
            });
            core.info('Performance baseline results: ' + JSON.stringify(results));
# Re-run marker: use the completed full-repository lint baseline and focus this run on API plus database benchmarks.
