name: Build private goxboard

run-name: Build goxboard ${{ inputs.source_ref }} @ ${{ inputs.sha }} on ${{ inputs.runner || 'ubuntu-24.04' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact private source commit SHA
        required: true
        type: string
      source_ref:
        description: Source branch or tag name for display
        required: true
        type: string
      source_kind:
        description: How this commit was discovered
        required: false
        default: manual
        type: string
      pr_number:
        description: Associated pull request number, if any
        required: false
        type: string
      base_sha:
        description: Exact base commit SHA for a source pull request
        required: false
        type: string
      runner:
        description: Ubuntu runner image used for this build
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04

permissions:
  contents: read

concurrency:
  group: goxboard-build-${{ inputs.sha }}-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: false

jobs:
  go:
    name: Go (build, vet, vulnerability scan, race and DB integration tests)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      GOXBOARD_IT_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      GOXBOARD_IT_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v7
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Verify Go module path and scan legacy imports
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          module="$(sed -n '1s/^module //p' go.mod)"
          if [[ "$module" != "github.com/yuyuzheng-dev/goxboard" ]]; then
            echo "::error::go.mod module is '$module', expected github.com/yuyuzheng-dev/goxboard"
            exit 1
          fi
          if git grep -n -E 'github.com/linusxiong/(ggboard|goxboard)' -- '*.go' go.mod; then
            echo "::error::legacy Go import path remains in the source repository"
            exit 1
          fi

      - name: Reject legacy project identifiers across the repository
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          legacy_hits="$(git grep -n -I -i -E 'ggboard' -- . || true)"
          if [[ -n "$legacy_hits" ]]; then
            printf '%s\n' "$legacy_hits"
            echo "::error::legacy pre-Goxboard identifiers remain in tracked source, tests, configuration, deployment or documentation"
            exit 1
          fi
          legacy_paths="$(git ls-files | grep -i -E 'ggboard' || true)"
          if [[ -n "$legacy_paths" ]]; then
            printf 'Legacy identifier in tracked path(s):\n%s\n' "$legacy_paths"
            echo "::error::legacy project identifiers remain in tracked file paths"
            exit 1
          fi
          echo "No legacy project identifiers remain in tracked file contents or paths."
          echo "Coverage includes PostgreSQL/MySQL usernames and database names, Docker volumes, SQLite files, BTCPay metadata, CLI output, tests, documentation and tracked paths."

      - name: Verify Goxboard persistence identity namespaces
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          legacy_identity_hits="$(git grep -n -E 'ggboard\.db|ggboard/mfa/totp-secret/v1|ggboard/subscription/age-identity/v1|ggboard:totp:|ggboard:age:|ggboard-backup-code:|iss:[[:space:]]*"ggboard"|Issuer[[:space:]]*=[[:space:]]*"ggboard"' -- . || true)"
          if [[ -n "$legacy_identity_hits" ]]; then
            printf '%s\n' "$legacy_identity_hits"
            echo "::error::legacy ggboard SQLite/JWT/cryptographic identity namespace remains"
            exit 1
          fi
          echo "SQLite, JWT, TOTP, AGE, and backup-code namespaces use Goxboard."
      - name: Reject legacy environment variable prefixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          legacy_env_refs="$(git grep -n -I -i -E 'GGBOARD_' -- . || true)"
          if [[ -n "$legacy_env_refs" ]]; then
            printf '%s\n' "$legacy_env_refs"
            echo "::error::legacy environment variable prefixes are not supported"
            exit 1
          fi
          echo "No legacy environment variable prefixes remain."

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      - name: gofmt
        working-directory: source
        run: |
          files="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$files" ]; then
            printf 'Files need gofmt:\n%s\n' "$files"
            for file in $files; do
              gofmt -d "$file" || true
            done
            exit 1
          fi

      - name: Build
        working-directory: source
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        working-directory: source
        run: go vet ./...

      - name: Vulnerability scan
        working-directory: source
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Critical MySQL/PostgreSQL migration regression
        working-directory: source
        run: go test ./internal/app/traffic -run "^TestIntegrationLegacyStatUsersPrimaryKeyMigration$" -race -count=1 -v

      - name: Test
        working-directory: source
        run: go test ./... -race -count=1

      - name: Validate sing-box configs with pinned stable cores
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/goxboard-singbox"
          mkdir -p "$fixture_dir"
          GOXBOARD_SINGBOX_FIXTURE_DIR="$fixture_dir" go test ./internal/subscription/formats -run TestSingboxEmptyNodeConfiguration -count=1

          validate_core() {
            local version="$1"
            local digest="$2"
            shift 2
            local dir="$RUNNER_TEMP/sing-box-$version"
            local archive="$dir/sing-box.tar.gz"
            mkdir -p "$dir"
            curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-linux-amd64.tar.gz" -o "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
            tar -xzf "$archive" -C "$dir"
            local binary
            binary="$(find "$dir" -type f -name sing-box -print -quit)"
            [[ -n "$binary" ]] || { echo "::error::sing-box $version binary not found in release archive"; exit 1; }
            chmod +x "$binary"
            "$binary" version
            for config in "$@"; do
              echo "sing-box $version: checking $config"
              # Golden files intentionally use a readable Reality placeholder. Replace it only in the
              # temporary native-core input so the core validates structure without weakening snapshots.
              checked_config="$RUNNER_TEMP/sing-box-check-$version-$(basename "$config")"
              sed 's/PUBLIC_KEY_BASE64URL/zCr4KWLwESlfCMeeFoBu3oPXaUS0vfhsJxQX0BLLH2A/g' "$config" > "$checked_config"
              "$binary" check -c "$checked_config"
            done
          }

          legacy_configs=(
            internal/subscription/formats/testdata/singbox.json.golden
            internal/subscription/formats/testdata/singbox-full-mirror-fakeip.json.golden
          )
          modern_configs=(
            internal/subscription/formats/testdata/singbox-1.14.json.golden
            internal/subscription/formats/testdata/singbox-1.14-full-mirror-fakeip.json.golden
          )
          # The empty-node fixtures are generated by the source test introduced in PR #70. Keep validating
          # current main and independent PRs while that test is not yet present, and include them once available.
          [[ -f "$fixture_dir/singbox-empty-legacy.json" ]] && legacy_configs+=("$fixture_dir/singbox-empty-legacy.json")
          [[ -f "$fixture_dir/singbox-empty-modern.json" ]] && modern_configs+=("$fixture_dir/singbox-empty-modern.json")

          validate_core "1.12.25" "a1ec76e2b6b139eb747a1b1ebee7d14b8d4be5a833596cad8070a31ef960301f" "${legacy_configs[@]}"
          validate_core "1.13.21" "24f9ef8e7234e13e71e74c3598a4164c5fe07b7b67ccc6e96cf68b54789f72cd" "${legacy_configs[@]}"
          validate_core "1.14.4" "699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968" "${modern_configs[@]}"

      - name: PostgreSQL/MySQL migration integration tests
        working-directory: source
        run: go test -tags integration -run Integration ./internal/db/ ./internal/importer/xboard/ ./internal/subscription/guard/ ./internal/app/traffic/

      - name: PostgreSQL/MySQL deposit transaction integration tests
        working-directory: source
        run: go test -tags integration -race -run '^TestIntegrationDeposit' ./internal/service/order/ -count=1 -v

  web:
    name: Web quality (install, audit, lint, typecheck, test)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v7
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Detect frontend
        id: detect
        run: |
          if [ -f source/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/web/pnpm-lock.yaml

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web install --frozen-lockfile

      - name: Vulnerability scan (production dependencies)
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web audit --prod

      - name: Report development-tool advisories
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm -C source/web audit --dev; then
            echo "::warning::Development-only advisories were reported; production dependencies remain the blocking security gate."
          fi

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web test

  web_build:
    name: Web build (PRERENDER=0, no Chromium)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v7
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C source/web install --frozen-lockfile

      - name: Build SPA without Chromium prerendering
        env:
          PRERENDER: "0"
        run: pnpm -C source/web build

      - name: Verify non-prerendered SPA output
        run: |
          set -euo pipefail
          test -s source/web/dist/index.html
          for snapshot in login register forgot; do
            if [[ -e "source/web/dist/$snapshot/index.html" ]]; then
              echo "::error::CI build unexpectedly prerendered /$snapshot"
              exit 1
            fi
          done

      - name: Upload exact-SHA frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: goxboard-web-dist-${{ inputs.sha }}
          path: source/web/dist/
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker (prebuilt frontend smoke)
    needs: [web_build]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v7
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Checkout source PR base for route regression comparison
        if: inputs.base_sha != ''
        uses: actions/checkout@v7
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.base_sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: base

      - name: Download frontend artifact from the exact source SHA
        uses: actions/download-artifact@v8
        with:
          name: goxboard-web-dist-${{ inputs.sha }}
          path: source/web/dist

      - name: Verify downloaded frontend artifact
        run: |
          set -euo pipefail
          test -s source/web/dist/index.html
          for snapshot in login register forgot; do
            if [[ -e "source/web/dist/$snapshot/index.html" ]]; then
              echo "::error::CI frontend artifact unexpectedly contains a prerendered /$snapshot snapshot"
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v4

      - name: Set up Go for cgroup runtime probe
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      - name: Build runtime image from prebuilt frontend
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/deploy/Dockerfile
          target: runtime-ci
          platforms: linux/amd64
          push: false
          load: true
          tags: goxboard:ci
          build-args: |
            VERSION=ci-${{ inputs.sha }}
          cache-from: |
            type=gha,scope=goxboard-ci
            type=gha,scope=goxboard
          cache-to: type=gha,scope=goxboard-ci,mode=max,ignore-error=true
          provenance: false
          sbom: false

      - name: Verify Docker CPU and memory limits are detected
        working-directory: source
        run: |
          set -euo pipefail
          if [[ ! -d internal/systemmetrics ]]; then
            echo "systemmetrics is not present in this source commit; skipping the feature-specific cgroup probe."
            exit 0
          fi
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/systemmetrics.test" ./internal/systemmetrics
          docker run --rm --cpus=1.5 --memory=512m --volume "$RUNNER_TEMP/systemmetrics.test:/systemmetrics.test:ro" --entrypoint /systemmetrics.test goxboard:ci -test.run '^TestCgroupRuntimeLimits$' -test.v

      - name: Check bundled CLI starts
        run: docker run --rm goxboard:ci version

      - name: Start image and probe guest config and SPA fallback
        env:
          GOXBOARD_JWT_SECRET: builder-runtime-smoke-secret-0123456789abcdef
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          name="goxboard-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$name" -p 127.0.0.1:18080:8080 \
            -e GOXBOARD_SERVER_ADDR=:8080 \
            -e GOXBOARD_DATA_DIR=/data \
            -e GOXBOARD_JWT_SECRET="$GOXBOARD_JWT_SECRET" \
            goxboard:ci serve

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/guest/config -o "$RUNNER_TEMP/guest-config.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { echo "::error::guest config did not become ready"; exit 1; }
          jq -e '.data.app_name != null and (.data.register_enabled | type == "boolean") and (.data.captcha | type == "object")' \
            "$RUNNER_TEMP/guest-config.json" >/dev/null

          root_status="$(curl -sS -o "$RUNNER_TEMP/index.html" -w '%{http_code}' http://127.0.0.1:18080/)"
          [[ "$root_status" == "200" ]] || { echo "::error::SPA root returned $root_status"; exit 1; }
          grep -qi '<html' "$RUNNER_TEMP/index.html" || { echo "::error::SPA root is not HTML"; exit 1; }

          # PR CI deliberately omits route snapshots. Verify both known and deep routes use the plain SPA shell.
          for route in /login /dashboard; do
            route_status="$(curl -sS -o "$RUNNER_TEMP/route.html" -w '%{http_code}' "http://127.0.0.1:18080$route")"
            [[ "$route_status" == "200" ]] || { echo "::error::SPA route $route returned $route_status"; exit 1; }
            grep -qi '<html' "$RUNNER_TEMP/route.html" || { echo "::error::SPA route $route did not return HTML"; exit 1; }
            grep -q '<div id="root"></div>' "$RUNNER_TEMP/route.html" || {
              echo "::error::SPA route $route did not return the non-prerendered shell"
              exit 1
            }
          done

          # A parallel PR may still inherit the endpoint from its base branch.
          # Enforce removal when this PR removes it, and on every base that has already removed it.
          source_has_healthz=false
          base_has_healthz=false
          if git -C source grep -Fq 'GET("/healthz"' -- '*.go'; then
            source_has_healthz=true
          fi
          if [[ -n "$BASE_SHA" ]]; then
            if git -C base grep -Fq 'GET("/healthz"' -- '*.go'; then
              base_has_healthz=true
            fi
          fi
          if [[ "$SOURCE_KIND" == "pull_request" && "$source_has_healthz" == true && "$base_has_healthz" == true ]]; then
            echo "::notice::This PR inherits the existing /healthz route unchanged from its base; the endpoint-removal PR validates this behavior."
          elif [[ "$SOURCE_KIND" == "branch" && "$SOURCE_REF" != "main" ]]; then
            echo "::notice::Skipping the health-path assertion for a non-PR feature branch."
          else
            if [[ "$source_has_healthz" == true ]]; then
              echo "::error::source commit still defines the public /healthz route"
              exit 1
            fi
            healthz_status="$(curl -sS -D "$RUNNER_TEMP/healthz.headers" -o "$RUNNER_TEMP/healthz.body" -w '%{http_code}' http://127.0.0.1:18080/healthz)"
            if [[ "$healthz_status" == "200" ]]; then
              grep -qi '^content-type: text/html' "$RUNNER_TEMP/healthz.headers" || {
                echo "::error::/healthz returned HTTP 200 without the normal SPA HTML fallback"
                exit 1
              }
            elif [[ "$healthz_status" != "404" ]]; then
              echo "::error::/healthz returned unexpected HTTP $healthz_status"
              exit 1
            fi
            if grep -Eq '"(version|uptime)"' "$RUNNER_TEMP/healthz.body"; then
              echo "::error::/healthz exposed runtime version or uptime diagnostics"
              exit 1
            fi
          fi

  report:
    name: Report aggregate status to private commit
    if: always()
    needs: [go, web, web_build, docker]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Publish commit status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          script: |
            const sha = context.payload.inputs.sha;
            const results = {
              go: '${{ needs.go.result }}',
              web: '${{ needs.web.result }}',
              web_build: '${{ needs.web_build.result }}',
              docker: '${{ needs.docker.result }}'
            };
            const passed = Object.values(results).every(result => result === 'success');
            const description = passed
              ? 'Go, Web quality/build, and Docker checks passed'
              : 'One or more build jobs failed or were cancelled';
            const targetUrl = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;

            await github.rest.repos.createCommitStatus({
              owner: 'yuyuzheng-dev',
              repo: 'goxboard',
              sha,
              state: passed ? 'success' : 'failure',
              context: 'goxboard-builder/ci',
              description,
              target_url: targetUrl
            });

            core.info('Private commit status: ' + (passed ? 'success' : 'failure'));
            core.info('Job results: ' + JSON.stringify(results));
