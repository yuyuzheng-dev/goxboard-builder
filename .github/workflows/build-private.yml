name: Build private goxboard

run-name: Build goxboard ${{ inputs.source_ref }} @ ${{ inputs.sha }} on ${{ inputs.runner || 'ubuntu-24.04' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact private source commit SHA
        required: true
        type: string
      source_ref:
        description: Source branch or tag name for display
        required: true
        type: string
      source_kind:
        description: How this commit was discovered
        required: false
        default: manual
        type: string
      pr_number:
        description: Associated pull request number, if any
        required: false
        type: string
      runner:
        description: Ubuntu runner image used for this build
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04

permissions:
  contents: read

concurrency:
  group: goxboard-build-${{ inputs.sha }}-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: false

jobs:
  go:
    name: Go (build, vet, vulnerability scan, race and DB integration tests)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      GOXBOARD_IT_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      GOXBOARD_IT_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v5
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Verify Go module path and scan legacy imports
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          module="$(sed -n '1s/^module //p' go.mod)"
          if [[ "$module" != "github.com/yuyuzheng-dev/goxboard" ]]; then
            echo "::error::go.mod module is '$module', expected github.com/yuyuzheng-dev/goxboard"
            exit 1
          fi
          if git grep -n -E 'github.com/linusxiong/(ggboard|goxboard)' -- '*.go' go.mod; then
            echo "::error::legacy Go import path remains in the source repository"
            exit 1
          fi

      - name: Reject legacy project identifiers across the repository
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          legacy_hits="$(git grep -n -I -i -E 'ggboard' -- . || true)"
          if [[ -n "$legacy_hits" ]]; then
            printf '%s\\n' "$legacy_hits"
            echo "::error::legacy pre-Goxboard identifiers remain in tracked source, tests, configuration, deployment or documentation"
            exit 1
          fi
          echo "No legacy project identifiers remain in tracked source files."
          echo "Coverage includes PostgreSQL/MySQL usernames and database names, Docker volumes, SQLite files, BTCPay metadata, CLI output, tests and documentation."

      - name: Verify Goxboard persistence identity namespaces
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          legacy_identity_hits="$(git grep -n -E 'ggboard\.db|ggboard/mfa/totp-secret/v1|ggboard/subscription/age-identity/v1|ggboard:totp:|ggboard:age:|ggboard-backup-code:|iss:[[:space:]]*"ggboard"|Issuer[[:space:]]*=[[:space:]]*"ggboard"' -- . || true)"
          if [[ -n "$legacy_identity_hits" ]]; then
            printf '%s\n' "$legacy_identity_hits"
            echo "::error::legacy ggboard SQLite/JWT/cryptographic identity namespace remains"
            exit 1
          fi
          echo "SQLite, JWT, TOTP, AGE, and backup-code namespaces use Goxboard."
      - name: Reject legacy environment variable prefixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          legacy_env_refs="$(git grep -n -I -i -E 'GGBOARD_' -- . || true)"
          if [[ -n "$legacy_env_refs" ]]; then
            printf '%s\\n' "$legacy_env_refs"
            echo "::error::legacy environment variable prefixes are not supported"
            exit 1
          fi
          echo "No legacy environment variable prefixes remain."

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      - name: gofmt
        working-directory: source
        run: |
          files="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$files" ]; then
            printf 'Files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Build
        working-directory: source
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        working-directory: source
        run: go vet ./...

      - name: Vulnerability scan
        working-directory: source
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test
        working-directory: source
        run: go test ./... -race -count=1

      - name: PostgreSQL/MySQL migration integration tests
        working-directory: source
        run: go test -tags integration -run Integration ./internal/db/ ./internal/importer/xboard/ ./internal/subscription/guard/

  web:
    name: Web (install, audit, lint, typecheck, test, build)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v5
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Detect frontend
        id: detect
        run: |
          if [ -f source/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web install --frozen-lockfile

      - name: Vulnerability scan (including development tools)
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web audit

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C source/web build

  docker:
    name: Docker (production image smoke)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - name: Checkout private source at exact commit
        uses: actions/checkout@v5
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          persist-credentials: false
          path: source

      - name: Build runtime image
        env:
          VERSION: ci-${{ inputs.sha }}
        run: docker build -f source/deploy/Dockerfile --build-arg "VERSION=$VERSION" -t goxboard:ci source

      - name: Check bundled CLI starts
        run: docker run --rm goxboard:ci version

  report:
    name: Report aggregate status to private commit
    if: always()
    needs: [go, web, docker]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Publish commit status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          script: |
            const sha = context.payload.inputs.sha;
            const results = {
              go: '${{ needs.go.result }}',
              web: '${{ needs.web.result }}',
              docker: '${{ needs.docker.result }}'
            };
            const passed = Object.values(results).every(result => result === 'success');
            const description = passed
              ? 'Go, Web, and Docker checks passed'
              : 'One or more build jobs failed or were cancelled';
            const targetUrl = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;

            await github.rest.repos.createCommitStatus({
              owner: 'yuyuzheng-dev',
              repo: 'goxboard',
              sha,
              state: passed ? 'success' : 'failure',
              context: 'goxboard-builder/ci',
              description,
              target_url: targetUrl
            });

            core.info('Private commit status: ' + (passed ? 'success' : 'failure'));
            core.info('Job results: ' + JSON.stringify(results));
