name: Audit Go module imports (final verification)

on:
  push:
    paths:
      - .github/workflows/migrate-module-path.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private goxboard source branch to audit
        required: true
        default: refactor/rename-goxboard-20261114
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Scan every Go file for legacy module paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: yuyuzheng-dev/goxboard
          ref: ${{ inputs.source_ref || 'refactor/rename-goxboard-20261114' }}
          token: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          path: source

      - name: Verify module and imports
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          module="$(sed -n '1s/^module //p' go.mod)"
          if [[ "$module" != "github.com/yuyuzheng-dev/goxboard" ]]; then
            echo "::error::go.mod module is '$module', expected github.com/yuyuzheng-dev/goxboard"
            exit 1
          fi
          if git grep -n -E 'github.com/linusxiong/(ggboard|goxboard)' -- '*.go' go.mod; then
            echo "::error::legacy Go module path remains in source"
            exit 1
          fi
          echo "All Go files use the canonical Goxboard module path."
