# Source validation is centralized here: a push to this file, the schedule, or manual dispatch discovers private source refs, queues Builder workflows, reports status on source commits, and verifies gofmt, Go build/vet/vulnerability/Race checks, PostgreSQL/MySQL integration, Web and Docker smoke tests, Goxboard-only retired-table cleanup, Xboard source-snapshot protection, and importer report/log secret redaction. A workflow-file push is also the immediate revalidation trigger for updated source PR heads.
# Pushes to this workflow revalidate the latest source PR heads immediately, including follow-up commits after an initial CI run.

on:
  push:
    paths:
      - ".github/workflows/poll-private.yml"
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit SHA to build directly
        required: false
        type: string
      force:
        description: Rebuild commits even if a result already exists
        required: false
        default: false
        type: boolean
      runner:
        description: Ubuntu runner image used for dispatched builds
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04

permissions:
  actions: write
  contents: read

concurrency:
  group: poll-private-goxboard
  cancel-in-progress: false

jobs:
  discover:
    name: Discover source commits and queue builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Discover eligible commits and dispatch build workflows
        uses: actions/github-script@v9
        env:
          SOURCE_TOKEN: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          SOURCE_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
          TARGET_PR: ''
          BUILD_RUNNER: ${{ inputs.runner || 'ubuntu-24.04' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'yuyuzheng-dev';
            const repo = 'goxboard';
            const base = '/repos/' + owner + '/' + repo;
            const token = process.env.SOURCE_TOKEN;

            if (!token) {
              core.warning('GOXBOARD_ACCESS_TOKEN is not configured. Add the fine-grained token described in README.md.');
              return;
            }

            async function sourceApi(path, options = {}) {
              const response = await fetch('https://api.github.com' + path, {
                method: options.method || 'GET',
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: 'Bearer ' + token,
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(options.headers || {})
                },
                body: options.body
              });
              const text = await response.text();
              if (!response.ok) {
                throw new Error('Private source API returned ' + response.status + ' for ' + path + ': ' + text.slice(0, 500));
              }
              return text ? JSON.parse(text) : null;
            }

            async function listAll(path) {
              const all = [];
              for (let page = 1; page <= 10; page++) {
                const separator = path.includes('?') ? '&' : '?';
                const items = await sourceApi(path + separator + 'per_page=100&page=' + page);
                all.push(...items);
                if (items.length < 100) break;
              }
              return all;
            }

            const candidates = new Map();
            const releaseCandidates = [];
            function addCandidate(sha, ref, kind, prNumber, baseSha) {
              if (!sha) return;
              if (process.env.TARGET_PR && String(prNumber) !== process.env.TARGET_PR) return;
              const existing = candidates.get(sha) || {
                sha,
                source_ref: ref,
                source_kind: kind,
                pr_number: '',
                base_sha: ''
              };
              if (prNumber) {
                existing.source_kind = 'pull_request';
                existing.pr_number = String(prNumber);
                existing.base_sha = baseSha || '';
              }
              candidates.set(sha, existing);
            }

            const manualRef = (process.env.SOURCE_REF || '').trim();
            if (manualRef) {
              const commit = await sourceApi(base + '/commits/' + encodeURIComponent(manualRef));
              addCandidate(commit.sha, manualRef, 'manual', '');
              const manualTag = manualRef.startsWith('refs/tags/') ? manualRef.slice('refs/tags/'.length) :
                (/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(manualRef) ? manualRef : '');
              if (manualTag) releaseCandidates.push({ tag: manualTag, sha: commit.sha });
            } else {
              const recentCutoff = Date.now() - 15 * 60 * 1000;
              const branches = await listAll(base + '/branches');
              for (const branch of branches) {
                const name = branch.name;
                const eligible = name === 'main' ||
                  ['fix/', 'feat/', 'refactor/', 'ci/'].some(prefix => name.startsWith(prefix));
                if (!eligible) continue;

                // Only bootstrap recently updated branch tips. Open PR heads are
                // always considered below, so old historical feature branches
                // do not trigger a large one-time build storm.
                const commit = await sourceApi(base + '/commits/' + branch.commit.sha);
                const committedAt = Date.parse(
                  commit.commit?.committer?.date || commit.commit?.author?.date || ''
                );
                if (Number.isFinite(committedAt) && committedAt >= recentCutoff) {
                  addCandidate(branch.commit.sha, name, 'branch', '');
                }
              }

              const pullRequests = await listAll(base + '/pulls?state=open');
              for (const pr of pullRequests) {
                if (pr.base.ref !== 'main') continue;
                if (!pr.head.repo || pr.head.repo.full_name !== owner + '/' + repo) {
                  core.warning('Skipping PR #' + pr.number + ': fork-head PRs are not enabled by this builder.');
                  continue;
                }
                addCandidate(pr.head.sha, pr.head.ref, 'pull_request', pr.number, pr.base.sha);
              }

              // New v* tags are built and published here, never by workflows in the source repository.
              const tags = await listAll(base + '/tags');
              for (const tag of tags) {
                if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag.name)) continue;
                const commit = await sourceApi(base + '/commits/' + tag.commit.sha);
                let taggedAt = '';
                try {
                  const tagRef = await sourceApi(base + '/git/ref/tags/' + encodeURIComponent(tag.name));
                  if (tagRef.object?.type === 'tag') {
                    const tagObject = await sourceApi(base + '/git/tags/' + tagRef.object.sha);
                    taggedAt = tagObject.tagger?.date || '';
                  }
                } catch (error) {
                  core.warning('Could not resolve tagger date for ' + tag.name + ': ' + error.message);
                }
                const createdAt = Date.parse(taggedAt || commit.commit?.committer?.date || commit.commit?.author?.date || '');
                if (!Number.isFinite(createdAt) || createdAt < recentCutoff) continue;
                addCandidate(commit.sha, tag.name, 'tag', '');
                releaseCandidates.push({ tag: tag.name, sha: commit.sha });
              }
            }

            const force = process.env.FORCE === 'true';
            let queued = 0;
            let skipped = 0;
            let perfQueued = 0;
            let perfSkipped = 0;
            const targetUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/workflows/build-private.yml';
            const perfTargetUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/workflows/benchmark-private.yml';
            const releaseTargetUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/workflows/release-private.yml';

            for (const candidate of candidates.values()) {
              const statuses = await sourceApi(base + '/commits/' + candidate.sha + '/statuses?per_page=100');
              const previous = statuses
                .filter(status => status.context === 'goxboard-builder/ci')
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (previous && !force) {
                const pendingAge = Date.now() - Date.parse(previous.created_at);
                if (previous.state !== 'pending' || pendingAge < 45 * 60 * 1000) {
                  skipped++;
                  continue;
                }
              }

              await sourceApi(base + '/statuses/' + candidate.sha, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  state: 'pending',
                  context: 'goxboard-builder/ci',
                  description: 'Queued for Go, Web, and Docker checks',
                  target_url: targetUrl
                })
              });

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'build-private.yml',
                  ref: 'main',
                  inputs: {
                    sha: candidate.sha,
                    source_ref: candidate.source_ref,
                    source_kind: candidate.source_kind,
                    pr_number: candidate.pr_number,
                    base_sha: candidate.base_sha || '',
                    runner: process.env.BUILD_RUNNER
                  }
                });
                queued++;
                core.info('Queued ' + candidate.source_kind + ' ' + candidate.source_ref + ' at ' + candidate.sha);
              } catch (error) {
                await sourceApi(base + '/statuses/' + candidate.sha, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    state: 'failure',
                    context: 'goxboard-builder/ci',
                    description: 'Builder workflow dispatch failed',
                    target_url: targetUrl
                  })
                });
                throw error;
              }

              // PR #39 owns the Phase 1 API and database performance baseline.
              // PR #42 owns Node Push flush-tail and PostgreSQL lock-contention diagnostics.
              // PR #43 owns database query/index and batched admin-write measurements.
              // PR #44 owns runtime, memory, goroutine, and connection-pool telemetry.
              // PR #45's runtime baseline is running on a059df0d; later PR45 commits only expand importer tests/docs, so avoid a duplicate expensive baseline.
              // Keep performance runs separate from normal CI so a failed functional
              // test does not prevent independent database measurements.
              if (['39', '42', '43', '44', '46', '62'].includes(candidate.pr_number)) {
                const previousPerf = statuses
                  .filter(status => status.context === 'goxboard-builder/perf-baseline')
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
                if (previousPerf && !force) {
                  const pendingAge = Date.now() - Date.parse(previousPerf.created_at);
                  if (previousPerf.state !== 'pending' || pendingAge < 45 * 60 * 1000) {
                    perfSkipped++;
                    continue;
                  }
                }

                await sourceApi(base + '/statuses/' + candidate.sha, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    state: 'pending',
                    context: 'goxboard-builder/perf-baseline',
                    description: candidate.pr_number === '42'
                    ? 'Queued for Node Push and PostgreSQL write-tail diagnostics'
                    : candidate.pr_number === '43'
                      ? 'Queued for DB query/index and batched-write performance diagnostics'
                      : candidate.pr_number === '44'
                        ? 'Queued for runtime, memory, goroutine and DB-pool diagnostics'
                        : candidate.pr_number === '45'
                          ? 'Queued for Xboard migration rehearsal and final API/DB performance acceptance'
                          : candidate.pr_number === '46'
                            ? 'Queued for traffic flush, MySQL query-plan and commission approval diagnostics'
                            : candidate.pr_number === '62'
                              ? 'Queued for 100k-user / 500k-order query coverage and existing DB baselines'
                              : 'Queued for SQLite API and database baselines',
                    target_url: perfTargetUrl
                  })
                });

                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'benchmark-private.yml',
                    ref: 'main',
                    inputs: {
                      source_sha: candidate.sha,
                      large_query_dataset: candidate.pr_number === '62' ? 'true' : 'false'
                    }
                  });
                  perfQueued++;
                  core.info('Queued performance diagnostics for PR #' + candidate.pr_number + ' at ' + candidate.sha);
                } catch (error) {
                  await sourceApi(base + '/statuses/' + candidate.sha, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      state: 'failure',
                      context: 'goxboard-builder/perf-baseline',
                      description: 'Performance baseline workflow dispatch failed',
                      target_url: perfTargetUrl
                    })
                  });
                  throw error;
                }
              }
            }

            let releasesQueued = 0;
            let releasesSkipped = 0;
            for (const candidate of releaseCandidates) {
              const statuses = await sourceApi(base + '/commits/' + candidate.sha + '/statuses?per_page=100');
              const ciStatus = statuses
                .filter(status => status.context === 'goxboard-builder/ci')
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (!ciStatus || ciStatus.state !== 'success') {
                releasesSkipped++;
                core.info('Waiting for successful CI before releasing ' + candidate.tag + ' at ' + candidate.sha);
                continue;
              }

              const previous = statuses
                .filter(status => status.context === 'goxboard-builder/release')
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (previous && !force) {
                const pendingAge = Date.now() - Date.parse(previous.created_at);
                if (previous.state !== 'pending' || pendingAge < 45 * 60 * 1000) {
                  releasesSkipped++;
                  continue;
                }
              }

              await sourceApi(base + '/statuses/' + candidate.sha, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  state: 'pending',
                  context: 'goxboard-builder/release',
                  description: 'Queued for release binaries and GHCR image',
                  target_url: releaseTargetUrl
                })
              });

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'release-private.yml',
                  ref: 'main',
                  inputs: {
                    tag: candidate.tag,
                    sha: candidate.sha
                  }
                });
                releasesQueued++;
                core.info('Queued release ' + candidate.tag + ' at ' + candidate.sha);
              } catch (error) {
                await sourceApi(base + '/statuses/' + candidate.sha, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    state: 'failure',
                    context: 'goxboard-builder/release',
                    description: 'Release workflow dispatch failed',
                    target_url: releaseTargetUrl
                  })
                });
                throw error;
              }
            }

            core.info('Queued ' + queued + ' CI build(s), skipped ' + skipped + ' checked commit(s); queued ' +
              perfQueued + ' performance baseline(s), skipped ' + perfSkipped + '; queued ' +
              releasesQueued + ' release(s), skipped ' + releasesSkipped + ' release(s).');

