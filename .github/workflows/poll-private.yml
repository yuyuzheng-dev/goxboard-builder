name: Poll private goxboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit SHA to build directly
        required: false
        type: string
      force:
        description: Rebuild commits even if a result already exists
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: poll-private-goxboard
  cancel-in-progress: false

jobs:
  discover:
    name: Discover source commits and queue builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover eligible commits and dispatch build workflows
        uses: actions/github-script@v7
        env:
          SOURCE_TOKEN: ${{ secrets.GOXBOARD_ACCESS_TOKEN }}
          SOURCE_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'yuyuzheng-dev';
            const repo = 'goxboard';
            const base = '/repos/' + owner + '/' + repo;
            const token = process.env.SOURCE_TOKEN;

            if (!token) {
              core.warning('GOXBOARD_ACCESS_TOKEN is not configured. Add the fine-grained token described in README.md.');
              return;
            }

            async function sourceApi(path, options = {}) {
              const response = await fetch('https://api.github.com' + path, {
                method: options.method || 'GET',
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: 'Bearer ' + token,
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(options.headers || {})
                },
                body: options.body
              });
              const text = await response.text();
              if (!response.ok) {
                throw new Error('Private source API returned ' + response.status + ' for ' + path + ': ' + text.slice(0, 500));
              }
              return text ? JSON.parse(text) : null;
            }

            async function listAll(path) {
              const all = [];
              for (let page = 1; page <= 10; page++) {
                const separator = path.includes('?') ? '&' : '?';
                const items = await sourceApi(path + separator + 'per_page=100&page=' + page);
                all.push(...items);
                if (items.length < 100) break;
              }
              return all;
            }

            const candidates = new Map();
            function addCandidate(sha, ref, kind, prNumber) {
              if (!sha) return;
              const existing = candidates.get(sha) || {
                sha,
                source_ref: ref,
                source_kind: kind,
                pr_number: ''
              };
              if (prNumber) {
                existing.source_kind = 'pull_request';
                existing.pr_number = String(prNumber);
              }
              candidates.set(sha, existing);
            }

            const manualRef = (process.env.SOURCE_REF || '').trim();
            if (manualRef) {
              const commit = await sourceApi(base + '/commits/' + encodeURIComponent(manualRef));
              addCandidate(commit.sha, manualRef, 'manual', '');
            } else {
              const branches = await listAll(base + '/branches');
              for (const branch of branches) {
                const name = branch.name;
                const eligible = name === 'main' ||
                  ['fix/', 'feat/', 'refactor/', 'ci/'].some(prefix => name.startsWith(prefix));
                if (eligible) addCandidate(branch.commit.sha, name, 'branch', '');
              }

              const pullRequests = await listAll(base + '/pulls?state=open');
              for (const pr of pullRequests) {
                if (pr.base.ref !== 'main') continue;
                if (!pr.head.repo || pr.head.repo.full_name !== owner + '/' + repo) {
                  core.warning('Skipping PR #' + pr.number + ': fork-head PRs are not enabled by this builder.');
                  continue;
                }
                addCandidate(pr.head.sha, pr.head.ref, 'pull_request', pr.number);
              }
            }

            const force = process.env.FORCE === 'true';
            let queued = 0;
            let skipped = 0;
            const targetUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/workflows/build-private.yml';

            for (const candidate of candidates.values()) {
              const statuses = await sourceApi(base + '/commits/' + candidate.sha + '/statuses?per_page=100');
              const previous = statuses
                .filter(status => status.context === 'goxboard-builder/ci')
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (previous && !force) {
                const pendingAge = Date.now() - Date.parse(previous.created_at);
                if (previous.state !== 'pending' || pendingAge < 45 * 60 * 1000) {
                  skipped++;
                  continue;
                }
              }

              await sourceApi(base + '/statuses/' + candidate.sha, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  state: 'pending',
                  context: 'goxboard-builder/ci',
                  description: 'Queued for Go, Web, and Docker checks',
                  target_url: targetUrl
                })
              });

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'build-private.yml',
                  ref: 'main',
                  inputs: {
                    sha: candidate.sha,
                    source_ref: candidate.source_ref,
                    source_kind: candidate.source_kind,
                    pr_number: candidate.pr_number
                  }
                });
                queued++;
                core.info('Queued ' + candidate.source_kind + ' ' + candidate.source_ref + ' at ' + candidate.sha);
              } catch (error) {
                await sourceApi(base + '/statuses/' + candidate.sha, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    state: 'failure',
                    context: 'goxboard-builder/ci',
                    description: 'Builder workflow dispatch failed',
                    target_url: targetUrl
                  })
                });
                throw error;
              }
            }

            core.info('Queued ' + queued + ' build(s); skipped ' + skipped + ' already-checked commit(s).');
